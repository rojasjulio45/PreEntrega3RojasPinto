<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autojoven · Vende tu auto</title>
<style>
/* Video vertical 1080x1920. Lenguaje: amarillo/negro de la marca, tipografía pesada, cortes secos y wipes. */
:root {
  --y: #f4c20d; --y2: #e5b007; --k: #0b0b0b; --k2: #171717; --k3: #262626; --w: #fafafa; --mute: #8a8a8a;
  --heavy: "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; }
body { display: grid; place-items: center; overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; background: var(--k); color: var(--w); font-family: var(--ui); }
.scene { position: absolute; inset: 0; }
.mask { overflow: hidden; display: block; padding-bottom: .1em; margin-bottom: -.1em; }
.mask > span { display: block; }

/* A · Pregunta */
#sA { background: var(--y); color: var(--k); }
.big { position: absolute; left: 80px; top: 560px; font: 900 196px/0.94 var(--heavy); letter-spacing: -0.04em; text-transform: uppercase; }

/* B · Formulario */
.form { position: absolute; left: 80px; right: 80px; top: 520px; display: grid; gap: 34px; }
.form h2 { margin: 0 0 20px; font: 900 64px/1 var(--heavy); letter-spacing: -0.02em; }
.form h2 em { font-style: normal; color: var(--y); }
.field { background: var(--k2); border-radius: 18px; padding: 26px 32px; border: 2px solid var(--k3); }
.field label { display: block; color: var(--y); font: 700 24px var(--ui); letter-spacing: .12em; text-transform: uppercase; }
.field .val { font: 600 60px/1.2 var(--ui); min-height: 72px; white-space: pre; }
.caret { display: inline-block; width: 6px; height: 56px; background: var(--y); vertical-align: -8px; margin-left: 6px; opacity: 0; }
.odo { display: inline-flex; gap: 6px; height: 72px; overflow: hidden; vertical-align: top; }
.odo .d { width: 46px; height: 72px; overflow: hidden; background: var(--k); border-radius: 8px; text-align: center; font: 700 56px/72px var(--mono); }
.odo .strip { display: block; }
.odo .strip span { display: block; height: 72px; }
.unit { font: 600 36px var(--ui); color: var(--mute); margin-left: 14px; vertical-align: 14px; }

/* C · Ficha */
.photo { position: absolute; left: 0; right: 0; top: 0; height: 1100px; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, var(--k)); }
.ficha { position: absolute; left: 80px; right: 80px; top: 1060px; }
.ficha h3 { margin: 0; font: 900 96px/1 var(--heavy); letter-spacing: -0.03em; }
.specs { display: flex; gap: 18px; margin-top: 28px; flex-wrap: wrap; }
.specs span { border: 2px solid var(--k3); border-radius: 99px; padding: 10px 26px; font: 600 32px var(--ui); }
.price { margin-top: 48px; display: flex; align-items: baseline; gap: 20px; }
.price b { font: 900 140px/1 var(--heavy); color: var(--y); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.price small { color: var(--mute); font-size: 32px; }
.stamp { position: absolute; right: 70px; top: 760px; padding: 18px 34px; border: 8px solid var(--y); color: var(--y); font: 900 64px/1 var(--heavy); letter-spacing: .04em; border-radius: 14px; transform: rotate(-9deg); background: rgba(11,11,11,.55); }
.live { position: absolute; left: 80px; top: 1640px; display: flex; align-items: center; gap: 18px; font: 700 36px var(--ui); }
.dot { width: 22px; height: 22px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 0 rgba(61,220,132,.6); }

/* D · Cierre */
#sD { background: var(--y); color: var(--k); clip-path: inset(100% 0 0 0); }
.steps { position: absolute; left: 80px; top: 520px; display: grid; gap: 12px; font: 900 110px/1.02 var(--heavy); letter-spacing: -0.035em; }
.steps .n { color: rgba(11,11,11,.28); }
.brand { position: absolute; left: 80px; right: 80px; bottom: 260px; display: flex; justify-content: space-between; align-items: center; }
.brand b { font: 900 76px var(--heavy); letter-spacing: -0.03em; }
.cta { background: var(--k); color: var(--y); font: 800 36px var(--ui); padding: 26px 40px; border-radius: 99px; }

/* Wipe */
.wipe { position: absolute; inset: 0; background: var(--y); transform: translateY(100%); z-index: 30; }

/* Vista previa */
#controls { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 99px; background: rgba(30,30,30,.9); color: #fff; font: 13px var(--ui); z-index: 100; }
#controls button { font: 700 13px var(--ui); background: var(--y); color: #111; border: 0; border-radius: 99px; padding: 6px 14px; cursor: pointer; }
#controls input { width: min(50vw, 360px); accent-color: var(--y); }
#controls span { font-variant-numeric: tabular-nums; min-width: 4.5em; }
.rendering #controls { display: none; }
</style>
</head>
<body>

<div id="stage" data-composition-id="autojoven" data-start="0" data-width="1080" data-height="1920">

  <div class="scene" id="sA">
    <div class="big"><span class="mask"><span>¿Vendes</span></span><span class="mask"><span>tu</span></span><span class="mask"><span>auto?</span></span></div>
  </div>

  <div class="scene" id="sB">
    <div class="form">
      <h2>Descríbelo.<br><em>Nosotros hacemos el resto.</em></h2>
      <div class="field" id="f1"><label>Modelo</label><div class="val"><span id="t1"></span><i class="caret" id="c1"></i></div></div>
      <div class="field" id="f2"><label>Año</label><div class="val"><span id="t2"></span><i class="caret" id="c2"></i></div></div>
      <div class="field" id="f3"><label>Kilometraje</label><div class="val"><span class="odo" id="odo"></span><span class="unit">km</span></div></div>
      <div class="field" id="f4"><label>Precio deseado</label><div class="val"><span id="t4"></span><i class="caret" id="c4"></i></div></div>
    </div>
  </div>

  <div class="scene" id="sC">
    <div class="photo"><img id="foto" src="../img/modelo1.png" alt=""></div>
    <div class="stamp" id="stamp">VALORIZADO</div>
    <div class="ficha">
      <h3 id="fh">Modelo 1</h3>
      <div class="specs" id="specs"><span>2021</span><span>45.320 km</span><span>2.0L Turbo</span></div>
      <div class="price" id="price"><b id="pv">$0</b><small>precio sugerido</small></div>
    </div>
    <div class="live" id="live"><span class="dot" id="dot"></span>Publicado en el portal</div>
  </div>

  <div class="scene" id="sD">
    <div class="steps">
      <span class="mask"><span><span class="n">1</span> Lo describes.</span></span>
      <span class="mask"><span><span class="n">2</span> Lo valorizamos.</span></span>
      <span class="mask"><span><span class="n">3</span> Lo publicamos.</span></span>
    </div>
    <div class="brand" id="brand"><b>AUTOJOVEN</b><span class="cta">Vende tu auto</span></div>
  </div>

  <div class="wipe" id="wipe"></div>
</div>

<div id="controls"><button id="play">Pausa</button><button id="restart">Reiniciar</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Tiempo"><span id="time">0.0 s</span></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const tl = gsap.timeline({ paused: true });
const DUR = 13;
const SNAP = "expo.out";

// Texto que se escribe: tween de un contador de caracteres, recalculable al saltar.
const type = (el, caret, text, at, dur) => {
  const o = { n: 0 };
  tl.set(caret, { opacity: 1 }, at)
    .to(o, { n: text.length, duration: dur, ease: "none", onUpdate: () => $(el).textContent = text.slice(0, Math.round(o.n)) }, at)
    .set(caret, { opacity: 0 }, at + dur + .25);
};

// Odómetro: una tira 0-9 por dígito; cada tira baja hasta su número, la última gira más.
const KM = "045320";
$("#odo").innerHTML = [...KM].map(() => `<span class="d"><span class="strip">${[...Array(20)].map((_, i) => `<span>${i % 10}</span>`).join("")}</span></span>`).join("");

gsap.set(["#sB", "#sC"], { opacity: 0 });

// A · Pregunta (0–2.2 s): líneas que suben desde su máscara, corte seco
tl.from("#sA .mask > span", { yPercent: 105, duration: .7, stagger: .16, ease: SNAP }, .15);
tl.to("#sA .big", { scale: 1.06, duration: 2, ease: "none", transformOrigin: "0 50%" }, 0);
tl.to("#wipe", { y: "0%", duration: .35, ease: "power3.in" }, 1.85);
tl.set("#sA", { opacity: 0 }, 2.2).set("#sB", { opacity: 1 }, 2.2);
tl.to("#wipe", { y: "-100%", duration: .4, ease: "power3.out" }, 2.2);

// B · Formulario (2.2–6.6 s)
tl.from("#sB h2", { y: 40, opacity: 0, duration: .5, ease: SNAP }, 2.35);
tl.from(".field", { x: -60, opacity: 0, duration: .5, stagger: .1, ease: SNAP }, 2.5);
type("#t1", "#c1", "Modelo 1", 3.0, .55);
type("#t2", "#c2", "2021", 3.75, .3);
$$("#odo .strip").forEach((s, i) => {
  const d = +KM[i] + (i === KM.length - 1 ? 10 : 0);
  tl.to(s, { y: -72 * d, duration: .9 + i * .12, ease: "power3.out" }, 4.2);
});
type("#t4", "#c4", "$20.000", 5.25, .5);
tl.to("#sB .form", { y: -80, opacity: 0, duration: .35, ease: "power3.in" }, 6.3);

// C · Ficha (6.6–10.2 s): foto con zoom lento, sello que golpea, precio que cuenta
tl.set("#sB", { opacity: 0 }, 6.65).set("#sC", { opacity: 1 }, 6.65);
tl.fromTo("#foto", { scale: 1.18 }, { scale: 1, duration: 3.6, ease: "power1.out" }, 6.65);
tl.from(".photo", { clipPath: "inset(0 0 100% 0)", duration: .5, ease: "power3.out" }, 6.65);
tl.from("#fh", { y: 50, opacity: 0, duration: .5, ease: SNAP }, 7.0);
tl.from("#specs span", { y: 20, opacity: 0, duration: .4, stagger: .08, ease: SNAP }, 7.2);
tl.from("#price", { opacity: 0, duration: .2 }, 7.5);
const p = { v: 0 };
tl.to(p, { v: 20000, duration: 1, ease: "power2.out", onUpdate: () => $("#pv").textContent = "$" + (Math.round(p.v / 10) * 10).toLocaleString("es-CL") }, 7.5);
tl.fromTo("#stamp", { scale: 2.6, opacity: 0, rotate: -20 }, { scale: 1, opacity: 1, rotate: -9, duration: .32, ease: "back.out(1.2)" }, 8.6);
tl.to("#sC", { x: 10, duration: .05, yoyo: true, repeat: 3, ease: "none" }, 8.9);
tl.from("#live", { y: 30, opacity: 0, duration: .4, ease: SNAP }, 9.2);
tl.fromTo("#dot", { boxShadow: "0 0 0 0 rgba(61,220,132,.6)" }, { boxShadow: "0 0 0 26px rgba(61,220,132,0)", duration: .9, repeat: 1, ease: "power1.out" }, 9.3);

// D · Cierre (10.2 s – fin): cortina amarilla desde abajo, pasos en tres golpes
tl.to("#sD", { clipPath: "inset(0% 0 0 0)", duration: .5, ease: "power4.inOut" }, 10.1);
tl.from("#sD .mask > span", { yPercent: 105, duration: .55, stagger: .28, ease: SNAP }, 10.55);
tl.from("#brand", { y: 60, opacity: 0, duration: .5, ease: SNAP }, 11.5);
tl.set({}, {}, DUR);

window.__timelines = window.__timelines || {};
window.__timelines.autojoven = tl;

// Vista previa (no afecta al render)
const rendering = navigator.webdriver || new URLSearchParams(location.search).has("render");
const stage = $("#stage");
if (rendering) {
  document.documentElement.classList.add("rendering");
  document.body.style.cssText = "display:block;background:none";
} else {
  const fit = () => { const s = Math.min(innerWidth / 1080, (innerHeight - 70) / 1920); stage.style.transform = `scale(${s})`; stage.style.margin = `0 ${1080 * s - 1080}px ${1920 * s - 1920 + 60}px 0`; };
  addEventListener("resize", fit); fit();
  const play = $("#play"), scrub = $("#scrub"), time = $("#time");
  const set = on => { on ? tl.play() : tl.pause(); play.textContent = on ? "Pausa" : "Reproducir"; };
  tl.eventCallback("onUpdate", () => { scrub.value = Math.round(tl.progress() * 1000); time.textContent = `${tl.time().toFixed(1)} s`; });
  tl.eventCallback("onComplete", () => set(false));
  play.onclick = () => { if (tl.progress() === 1) tl.restart(); set(tl.paused()); };
  $("#restart").onclick = () => { tl.restart(); set(true); };
  scrub.oninput = () => { set(false); tl.progress(scrub.value / 1000); };
  set(!matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (tl.paused()) tl.time(8.0);
}
</script>
</body>
</html>
